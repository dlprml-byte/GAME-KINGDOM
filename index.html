
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b50">
<title>GAME KINGDOM</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;color:#fff;font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#174a9c,#07112e 65%,#030817);
 min-height:100vh
}
header{text-align:center;padding:25px 12px 15px}
.crown{font-size:38px}
h1{margin:5px;color:#ffd76a;font-size:30px;letter-spacing:2px}
header p{color:#c8d8ff;margin:7px}
.section{padding:12px 15px}
.section h2{color:#ffda72;font-size:19px}
.profile{
 background:#102b60;border:1px solid #d9ae4c;
 border-radius:15px;padding:14px;margin:10px 0 18px
}
input{
 width:100%;padding:12px;border:0;border-radius:9px;
 margin:8px 0;background:#fff;color:#111;font-size:16px
}
button{
 border:0;border-radius:9px;padding:11px 16px;
 background:linear-gradient(135deg,#ffe28b,#d89c25);
 color:#17234b;font-weight:bold;cursor:pointer
}
.games{
 display:flex;gap:14px;overflow-x:auto;
 padding:10px 3px 20px;scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.games::-webkit-scrollbar{display:none}
.game{
 flex:0 0 72%;max-width:245px;min-height:190px;
 scroll-snap-align:center;position:relative;overflow:hidden;
 border:1px solid #e8c35f;border-radius:20px;
 background:linear-gradient(145deg,#173f83,#091638);
 box-shadow:0 8px 22px #0008;text-align:center;
 padding:20px 12px;cursor:pointer;
 transition:.25s
}
.game:active{transform:scale(.96)}
.game .emoji{font-size:58px;display:block;margin:8px}
.game h3{
 color:#ffe08a;font-size:19px;
 animation:glow 1.8s infinite alternate
}
.game p{font-size:12px;color:#c9d8ff}
@keyframes glow{
 from{text-shadow:0 0 3px #ffcf55}
 to{text-shadow:0 0 15px #ffd45d,0 0 25px #e9a52c}
}
.game:after{
 content:"";position:absolute;width:100px;height:100px;
 background:#ffffff0c;border-radius:50%;top:-35px;right:-25px
}
.slidehint{text-align:center;color:#b8caff;font-size:12px}
.panel{
 display:none;margin:15px;padding:16px;
 background:#102653;border:1px solid #d7b65d;
 border-radius:18px;text-align:center
}
.panel h2{color:#ffdc7d}
.back{background:#dce8ff;color:#102653;margin-bottom:12px}
.status{color:#ffe08a;min-height:28px;margin:12px}
.board{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:5px;max-width:300px;margin:15px auto
}
.cell{
 background:#e8d39a;color:#17234b;border-radius:8px;
 min-height:55px;display:grid;place-items:center;
 font-size:22px;font-weight:bold;cursor:pointer
}
.ludoBoard{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:5px;max-width:300px;margin:15px auto
}
.ludoCell{
 height:55px;background:#e5d6a9;color:#18234c;
 border-radius:8px;display:grid;place-items:center;font-size:21px
}
canvas{
 width:100%;max-width:330px;background:#c58b43;
 border:8px solid #e9cf8d;border-radius:50%;
 display:block;margin:15px auto;touch-action:manipulation
}
footer{text-align:center;padding:25px 10px;color:#b7caff;font-size:13px}
</style>
</head>
<body>

<header>
 <div class="crown">👑</div>
 <h1>GAME KINGDOM</h1>
 <p>THE ROYAL WORLD OF GAMES</p>
</header>

<div class="section">
 <div class="profile">
  <b>🎮 Player Profile</b>
  <input id="playerName" placeholder="आफ्नो नाम लेख्नुहोस्">
  <button onclick="saveName()">Save Name</button>
  <p id="welcome">Welcome to Game Kingdom!</p>
 </div>

 <h2>👑 KINGDOM GAME COLLECTION</h2>
 <p class="slidehint">गेम हेर्न दायाँ-बायाँ Slide गर्नुहोस् ⬅️ ➡️</p>
 <div class="games" id="games"></div>
</div>

<div class="panel" id="gamePanel">
 <button class="back" onclick="closeGame()">← Back to Kingdom</button>
 <h2 id="gameTitle">Game</h2>
 <div id="gameContent"></div>
 <div class="status" id="status"></div>
</div>

<footer>
 👑 GAME KINGDOM 👑<br><br>
 Developed by <b>Dilip Rimal</b><br>
 © 2026 Game Kingdom
</footer>

<script>
const gameList=[
 ["Ludo","🎲","Play Ludo"],
 ["Bagchal","🐅","Tiger & Goat"],
 ["Carrom","🔴","Carrom Board"],
 ["Call Break","🃏","Card Game"],
 ["Marriage","🎴","Marriage Card"],
 ["Rummy","♠️","Rummy Cards"],
 ["29 Card Game","♦️","Twenty Nine"],
 ["Teen Patti","🎰","Teen Patti"],
 ["Poker","♣️","Poker Cards"],
 ["Gin Rummy","🂡","Gin Rummy"],
 ["Dhumbal","🎴","Dhumbal Cards"],
 ["Kitty","🃏","Kitty Card Game"]
];

const games=document.getElementById("games");
gameList.forEach((g,i)=>{
 const card=document.createElement("div");
 card.className="game";
 card.innerHTML=`<span class="emoji">${g[1]}</span>
 <h3>${g[0]}</h3><p>${g[2]}</p><button>PLAY NOW</button>`;
 card.onclick=()=>openGame(g[0]);
 games.appendChild(card);
});

function saveName(){
 const n=document.getElementById("playerName").value.trim();
 if(!n)return alert("नाम लेख्नुहोस्");
 localStorage.setItem("kingdomName",n);
 document.getElementById("welcome").textContent="Welcome, "+n+"! 👑";
}
const saved=localStorage.getItem("kingdomName");
if(saved){
 document.getElementById("playerName").value=saved;
 document.getElementById("welcome").textContent="Welcome, "+saved+"! 👑";
}

let currentGame="";
function openGame(name){
 currentGame=name;
 document.getElementById("gamePanel").style.display="block";
 document.getElementById("gameTitle").textContent="👑 "+name;
 document.getElementById("status").textContent="";
 const c=document.getElementById("gameContent");
 c.innerHTML="";
 document.getElementById("gamePanel").scrollIntoView({behavior:"smooth"});
 if(name==="Ludo")ludo(c);
 else if(name==="Bagchal")bagchal(c);
 else if(name==="Carrom")carrom(c);
 else c.innerHTML=`<h3>${name}</h3>
 <p>यो गेमको पूरा gameplay निर्माण हुँदैछ।</p>
 <p>GAME KINGDOM मा छिट्टै उपलब्ध हुनेछ।</p> 🎮`;
}
function closeGame(){
 document.getElementById("gamePanel").style.display="none";
 document.getElementById("gameContent").innerHTML="";
}

function ludo(c){
 let pos=0,turn=0;
 c.innerHTML=`<h3>🎲 LUDO MINI</h3>
 <p>Dice फाल्नुहोस् र आफ्नो गोटी अगाडि बढाउनुहोस्।</p>
 <div class="ludoBoard" id="ludoBoard"></div>
 <button onclick="rollLudo()">🎲 Roll Dice</button>
 <div class="status" id="ludoStatus">तपाईंको पालो</div>`;
 drawLudo();
 function drawLudo(){
  const b=document.getElementById("ludoBoard");
  b.innerHTML="";
  for(let i=0;i<16;i++){
   const d=document.createElement("div");
   d.className="ludoCell";
   d.textContent=i===pos?"🔴":(i===15?"🏁":"");
   b.appendChild(d);
  }
 }
 window.rollLudo=function(){
  const dice=Math.floor(Math.random()*6)+1;
  pos+=dice;
  if(pos>=15)pos=15;
  document.getElementById("ludoStatus").textContent=
   "तपाईंले "+dice+" पाउनुभयो! स्थान: "+pos;
  drawLudo();
  if(pos===15)document.getElementById("ludoStatus").textContent="🏆 तपाईं विजेता!";
 };
}

function bagchal(c){
 let board=Array(25).fill("");
 board[0]="🐅";board[4]="🐅";board[20]="🐅";board[24]="🐅";
 let goats=0,selected=-1,goatTurn=true;
 c.innerHTML=`<h3>🐅 BAGCHAL MINI</h3>
 <p>बाख्रा राख्नुहोस्, बाघलाई रोक्नुहोस्।</p>
 <div class="board" id="bagBoard"></div>
 <p id="bagInfo">बाख्राको पालो: खाली घर छान्नुहोस्</p>`;
 draw();
 function draw(){
  const b=document.getElementById("bagBoard");b.innerHTML="";
  board.forEach((v,i)=>{
   const d=document.createElement("div");d.className="cell";
   d.textContent=v||"·";
   d.style.outline=selected===i?"3px solid #ffcf55":"none";
   d.onclick=()=>tap(i);b.appendChild(d);
  });
 }
 function tap(i){
  if(goatTurn){
   if(board[i])return;
   board[i]="🐐";goats++;goatTurn=false;
   document.getElementById("bagInfo").textContent="बाघको पालो: बाघ छान्नुहोस्";
  }else{
   if(board[i]!=="🐅")return;
   selected=i;draw();
   const target=board.findIndex((v,j)=>!v && Math.abs(j-i)===1);
   if(target<0){
    document.getElementById("bagInfo").textContent="बाघका लागि खाली छेउको घर छैन।";
    return;
   }
   board[i]="";board[target]="🐅";goatTurn=true;selected=-1;
   document.getElementById("bagInfo").textContent="बाख्राको पालो";
  }
  if(goats>=20)document.getElementById("bagInfo").textContent="बाख्रा राख्ने चरण पूरा भयो!";
  draw();
 }
}

function carrom(c){
 c.innerHTML=`<h3>🔴 CARROM MINI</h3>
 <p>बोर्डमा ट्याप गरेर गोटी चलाउनुहोस्।</p>
 <canvas id="carromCanvas" width="330" height="330"></canvas>
 <button onclick="resetCarrom()">Reset Board</button>`;
 const cv=document.getElementById("carromCanvas");
 const ctx=cv.getContext("2d");
 let striker={x:165,y:270,vx:0,vy:0};
 let coins=[{x:165,y:165,r:12},{x:145,y:165,r:10},{x:185,y:165,r:10},
 {x:165,y:145,r:10},{x:165,y:185,r:10}];
 function draw(){
  ctx.clearRect(0,0,330,330);
  ctx.strokeStyle="#6c3515";ctx.lineWidth=5;
  ctx.strokeRect(15,15,300,300);
  coins.forEach((p,i)=>{
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fillStyle=i===0?"#d83232":"#f4e6c4";ctx.fill();
  });
  ctx.beginPath();ctx.arc(striker.x,striker.y,15,0,Math.PI*2);
  ctx.fillStyle="#254baf";ctx.fill();
 }
 cv.onclick=e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*330/r.width;
  const y=(e.clientY-r.top)*330/r.height;
  striker.vx=(x-striker.x)*.08;
  striker.vy=(y-striker.y)*.08;
  document.getElementById("status").textContent="Carrom shot!";
 };
 function animate(){
  striker.x+=striker.vx;striker.y+=striker.vy;
  striker.vx*=.96;striker.vy*=.96;
  if(striker.x<30||striker.x>300)striker.vx*=-.7;
  if(striker.y<30||striker.y>300)striker.vy*=-.7;
  striker.x=Math.max(30,Math.min(300,striker.x));
  striker.y=Math.max(30,Math.min(300,striker.y));
  draw();requestAnimationFrame(animate);
 }
 window.resetCarrom=function(){
  striker={x:165,y:270,vx:0,vy:0};
  coins=[{x:165,y:165,r:12},{x:145,y:165,r:10},
  {x:185,y:165,r:10},{x:165,y:145,r:10},{x:165,y:185,r:10}];
 };
 draw();animate();
}
</script>
</body>
</html>

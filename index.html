
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d20">
<title>GAME KINGDOM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:white;
 background:radial-gradient(circle at top,#253b78,#080d20 70%);
 min-height:100vh;
}
header{
 text-align:center;
 padding:25px 10px;
}
header h1{
 font-size:32px;
 margin:0;
 color:#ffd76a;
 text-shadow:0 0 15px #ffb700;
 animation:pulse 2s infinite;
}
header p{color:#b9c9ed}
@keyframes pulse{
 50%{text-shadow:0 0 30px gold,0 0 45px orange}
}
.section-title{
 text-align:center;
 color:#ffd76a;
 margin:15px;
}
.slider{
 display:flex;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
 gap:18px;
 padding:20px;
 scrollbar-width:none;
}
.slider::-webkit-scrollbar{display:none}
.game{
 flex:0 0 85%;
 max-width:360px;
 margin:auto;
 scroll-snap-align:center;
 min-height:350px;
 border:2px solid #657fff;
 border-radius:25px;
 background:linear-gradient(145deg,#182b58,#10172e);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 box-shadow:0 0 22px #315bff66;
 transition:.3s;
}
.game:active{transform:scale(.96)}
.game .emoji{
 font-size:90px;
 animation:float 2s infinite ease-in-out;
}
@keyframes float{
 50%{transform:translateY(-12px)}
}
.game h2{
 font-size:30px;
 color:#ffd76a;
 text-shadow:0 0 12px #ffb700;
 animation:pulse 2s infinite;
}
.game p{color:#c5d2f2}
.play{
 border:0;
 border-radius:30px;
 padding:13px 35px;
 background:linear-gradient(90deg,#ffbd36,#ff6b00);
 color:#111;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}
.controls{
 display:flex;
 justify-content:center;
 gap:25px;
 padding:10px;
}
.controls button{
 background:#263d79;
 color:white;
 border:1px solid #829bff;
 padding:12px 22px;
 border-radius:25px;
 font-size:20px;
}
.dots{
 text-align:center;
 padding:10px;
 color:#ffd76a;
 letter-spacing:7px;
}
footer{
 text-align:center;
 padding:30px 10px;
 color:#9eadd1;
}
</style>
</head>

<body>

<header>
<h1>👑 GAME KINGDOM 👑</h1>
<p>Welcome to the Gaming World</p>
</header>

<h3 class="section-title">🎮 CHOOSE YOUR GAME</h3>

<div class="slider" id="slider">

<div class="game">
<div class="emoji">🎲</div>
<h2>LUDO KING</h2>
<p>Play the classic Ludo game</p>
<button class="play" onclick="openGame('ludo')">PLAY NOW</button>
</div>

<div class="game">
<div class="emoji">⚡</div>
<h2>CARROM</h2>
<p>Enjoy the carrom challenge</p>
<button class="play" onclick="openGame('carrom')">PLAY NOW</button>
</div>

<div class="game">
<div class="emoji">🧠</div>
<h2>QUIZ ARENA</h2>
<p>Test your knowledge</p>
<button class="play" onclick="openGame('quiz')">PLAY NOW</button>
</div>

</div>

<div class="controls">
<button onclick="moveSlide(-1)">❮</button>
<button onclick="moveSlide(1)">❯</button>
</div>

<div class="dots">● ● ●</div>

<footer>
👑 GAME KINGDOM<br>
Gaming • Fun • Entertainment
</footer>

<script>
const slider=document.getElementById("slider");

function moveSlide(direction){
 const card=slider.querySelector(".game");
 const gap=18;
 slider.scrollBy({
  left:direction*(card.offsetWidth+gap),
  behavior:"smooth"
 });
}

let autoSlide=setInterval(()=>moveSlide(1),4000);

slider.addEventListener("touchstart",()=>{
 clearInterval(autoSlide);
},{passive:true});

function openGame(name){
 if(name==="quiz"){
  window.location.href="https://dlprml-byte.github.io/Quiz-Arena/";
 }else{
  alert(name.toUpperCase()+" GAME - Coming Soon!");
 }
}
</script>

</body>
</html>
